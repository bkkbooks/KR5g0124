body:
  text: 罪於玉帝告下五帝神兵罰子之身七祖被拷長閉河源奉者愼焉元始天王經元始天王稟天自然之𠃴結形未沌之霞託體虛生之胎生乎空洞之際時玄景未分天光冥逮浩漫太虛積七千餘劫天朗炁清二暉纏絡玄雲紫蓋映其首六氣之電翼其眞夜生自明神光燭室散虛馥之煙栖心霄霞之境鍊容洞波之濱獨秉靈符之節抗御玄降之章內炁玄崖濳想幽窮忽焉逍遙流盻忘旋瓊輪玉輿碧輦玄龍飛精流靄耀電虛宮東遊碧水豪林之境上𢠾青霞九曲之房進登金闕受號玉清紫虛高上元皇太上大道君金簡玉札使奏名東華方諸青宮受命總統億津玄降玉華之女金晨之童各三千人飛龍毒獸巨虬千尋玃天奮爪備衞玉關天威煥赫陳于廣庭飛青羽蓋流紫鳳章金眞玉光豁落七元神虎上符流金火鈴結編元皇位登玉清掌括上皇高帝之眞道備炁澄仍讚靈篇三十九章玉慧激詞演究旡窮妙音發於始天玉響啟於洞門故號能書大洞眞經其道極尊與元始俱生高上妙化量難可勝流音億兆而不休經萬劫而方新自无金簡玉名不得參聞後學之徒懃志高尙棄累忘塵寂心長阜對景霄晨精齋苦念倦不敢眠奏金簡玉札記名玉清然後得受大洞眞經口訣三元立到發音駭動九天有得此章上眞之根次有金簡奏札玉郎名參東華便爲眞人室招虛生之暉堂降百和之煙玉華侍側金晨衞形洞鑒極天之崖協三光以通眞運五晨以騁駕策飛龍以御輪上登三素之宮拜謁太帝之前高上元皇之所禀太上大道之極眞微乎元始靈化祕文以付上相青童君掌錄東華使傳後聖應爲眞人者其道寶祕不傳下世輕泄神文身没幽源殃及七玄長充下鬼萬不得仙上相青童君曰金簡玉札出自太上靈都之宮刻玉爲札結金爲簡書以朱文編以紫繩常以玄雲紫葢廕其房百和之香散其庭使西華玉女金晨玉童各三百人典衞靈文元始天王受於太上大道君其眞科七百年三傳凡是學者雖未得此文其名皆已逆參青宮但旡金簡玉字爾領仙侍郎典錄玉司常以陰察精麄其有勤尙苦志皆令玄授此文使奏名玉皇三元東華太上當遣眞人授其眞經後聖眾眞莫不先奏簡於東華投玉札於上清然後得受大洞眞經精齋苦行上爲眞人末學之徒青宮无有金簡之錄玉格旡有玄編之名神經亦不可得而授彼天魔亦不可得而收眞靈終亦不降玉女亦不衞子之身今故禀上皇之科抄集品次以爲後學開津之逕有心者宜加清齋督志懃尙注念玄眞感徹玉皇奏簡青宮便得誦詠神經通釋幽玄太上尅遣丹輿飛軿來迎兆身上登玉清然此經禁戒尤重非眞不傳太上常以正月一日七月七日九月九日一年三遣玉晨元皇太極眞人領仙玉郎詣東華青宮校定眞仙簿錄其有金簡玉名者卽言奏三元隨學深淺玉童玉女防衞其身若有漏泄輕眞慢法爲玉童所奏雖有金簡卽被除移名鬼官身被風刀之栲七玄之祖運蒙山之石塡積夜之河凡積學之士每以其日當夷心寂室清齋靜念散香左右朱書金簡八通紫繩結篇以奏高上玉皇東華青宮玉札八枚以奏三元先於室內東向叩齒九通讀簡札一過畢口祝上啟太上高上玉皇三十九帝二十四眞甲受生末世久染囂塵感荷先慶福德所鍾得覩眞文今奏金簡言名玉清封付靈嶽長爲天臣乞白高上記名三元賜給玉童玉女衞身得乘飛霞上昇帝宮畢起再拜奏高上玉皇金簡上篇某嶽先生王甲字某甲本命某子某月生某年某月朔日子奏金簡紫錄玉籍寶文上詣太上高上玉皇三十九帝二十四高眞金簡紫輝玉景瓊宮右書紫文上一尺連金簡頭係高上虛皇玉清東華青宮眞人王甲稽首再拜右書一簡上奏言右書一簡上高上虛皇玉晨太上大道君二十四玉皇三十九帝尊甲季世小臣忝染餘慶福祚所充得叅上眞謹依玄格正月一日上奏金簡記名東華乞賜編錄降下眞靈得乘飛霞上昇帝晨身登金闕朝謁玉皇謹奏右三簡上令足某郡某縣鄕里某嶽道士王甲年如干𡻕字某甲右書一簡上某子生某月子命屬某嶽某帝某里右書一簡上太𡻕某子正月某子一日某子於某郡縣鄕中封某嶽奏右書一簡上合用金簡八枚紫繩編之北向讀簡一過畢起執簡再拜奏三元君玉札上篇某甲先生王甲字某甲本命某子某月生某年正月朔一日某子奏金簡玉札仙簿錄籍符上詣白素元君黃素元君紫素元君三元紫蓋金輝洞房宮右書一尺白文上連玉簡頭係三元君玉清始學眞人王甲稽首再拜右書一札上奏上右書一札上太素三元君甲昔有因緣福慶所種得受神經未敢披看謹依東華玄格奉奏玉札記名青宮上言三元乞賜編錄降下眞靈得昇帝晨上朝玉眞謹奏右書三札上某郡某縣鄕里某嶽始學眞人王甲年如干字某甲右書一札上某子生某月子命屬某嶽某帝某甲右書一札上太𡻕某子正月某朔一日某子於某郡縣里中封某嶽奏右書一札上合用玉札八枚以紫繩編之西向讀玉札一過畢口祝上答太素元君黃素元君紫素元君甲昔蒙眞師盟授眞經今奏玉札記名三清乞賜給玉女眞靈降身得乘紫霞上登帝宮畢起再拜奏東華青宮上相金簡一篇某嶽先生王甲字某甲本命某子某月生某年正月某朔一日某子奏金簡青錄仙籍文上太清玉寶金闕上相高晨師東海青童君東華方諸青宮右書青文一尺上連簡頭係高上玉清青童上相始學眞人王甲稽首再拜右書一簡上奏言右書一簡上太清玉寶金闕上相高晨師東海青童君甲沉染下俗慶運所充福祚下流得生人道叅眞係炁志在絕跡栖身長阜託廕靈嶽謹案玄科奉奏金簡記名上宮乞賜上編玉清降下神眞得離下世上昇金闕進朝玉皇謹奏右書三簡上封金簡玉札五嶽上法某郡縣鄕里某嶽始學眞人王甲年如干字某甲右書一簡上某子生某月子命屬某嶽某帝某星右書一簡上太𡻕某子正月某朔一日某子於某郡縣鄕里中封付某嶽奏右書一簡上合用金簡八枚以紫繩結之東向讀簡一過畢口祝上啟太淸玉寶金闕上相高晨師東海青童君甲宿緣福慶充流後代蒙眞師成就得受上經謹奏金簡記名青宮乞賜編錄掌付玉郎普告諸天諸地洞清洞淵洞源五嶽眾仙咸見右別降以眞靈得乘飛霞上昇三清畢起再拜三面奏簡都畢還東向叩齒九通咒曰元綱玄邈天眞幽冥蒙受先慶福加來生昔緣眞師誡授寶經敢告三元上奏玉清金書東華錄籍記名長爲帝臣希降眞靈賜給玉童玉女衞形得乘飛霄上昇金闕拜謁玉庭畢仰嚥液九過止都記以簡札埋於所屬嶽令玉皇篇在北三元篇在西青宮篇在東入土三尺堅築其上埋畢北向伏地叩齒九通又咒曰名奏玉格錄字上清金簡玉札結篇皇庭高上玄遐三元幽冥眞官來降謹關有靈封簡神嶽錄奏三清列上東華著我玉名得乘玄輿飛霞綠軿上造三元騰身帝晨訖起再拜元始天王所受太上投簡求仙上法三奏簡札九年之內玉皇尅降丹精玉芝龍璽鳳章太極眞人來降子房三元尅遣玉童玉女三十六人上相青童尅告五嶽給以仙官飛霞玄蓋迎子之身上昇金闕之宮太上寶祕此文不傳於世故付上相青童掌錄以校眞仙簿籍傳付應爲眞人者若有骨炁相宜或精求苦念感徹上清得見上文其名便以逆注青宮依科奏簡便成眞人太上以西華玉女三十六人侍衞靈篇記功明善子有此文常當燒香禮念如奉君父神明自當降見於寢房也違科泄慢則身沒鬼官長閉地獄萬不得仙明愼之焉諸學仙之家无有此文不得妄動三十九章玉清寶經凡詠玉經皆駭動九天諸天王悉禮伏聽音所徹高遠所制不小詠誦之日東華領仙玉晨卽校玉名有奏金簡者卽普告諸天諸地三界悉使詣界稽首旡有金名玉札而詠三十九章則遙動高上卽下執司右別妄叩神經之者皆忘神失精意性錯異怒喜旡常也學者億萬至於合眞旡一懃苦求尋而鮮不中敗或自頽懈或興憤忿作性罵詈誅擊神鬼或毀謗神文疑惑不眞或泄漏寶訣形露世間此皆由東華旡有金名不爲三界稱善而爲眾魔所乘萬試所敗死之徵也故三十九章不可得而妄動有得此經宜加禮拜清齋修奉不妄詠諷久久自然當得金簡玉篇也謁青宮投金簡玉格凡學道道成應眞人皆先詣東華方諸青宮投簡謁青童君也東華有六門門內週迴三千里東門名靑華門門郎姓邱名伯淵主學仙簿錄所經南門名神華玉門門郎姓玉名祖思主眞人神仙出入所經西門名玉洞門門郎姓庾名尙節主高上眾眞玉皇三十九章二十四玉眞西龜王母所出入北門名玉陰門門郎姓史名少華主眞仙及始學者犯糺退降所經東南門名天關門門郎姓名名五車主人宿命因緣簿錄得仙所由東北門名寒水門門郎姓童名林都主鬼爽轉敘所經右六門治天東𡾩山門有獅子巨獸各三百頭衞門侍門各三千守士學道之人冝先知門名次第有知者則爲不死名便得奏青宮然當入室燒香常存念門名及門郎姓字九年尅得乘雲昇門也此道祕在玉寶宮內有得知者白日昇天輕泄傳付非眞長閉夜獄終不得輕於東華靑宮也門內有三宮第一宮名方諸靑宮第二宮名玉寶靑宮第三宮名玉華靑宮宮內有玉樹數百株上有鵾鷂鳳凰九色之鳥下有芝草玉井自生之泉飲之夀同三光獅子天獸附墻上相靑童君治在方諸靑宮之內金殿瓊房之裏眾眞侍女三千人侍衞左右玄暉自映神燭自明靑霞廕其上紫霄繞其房宮內北殿上有金格格上有玉格格上有學仙簿錄及玄名年深深淺金簡玉札有十萬篇領仙玉郎典之有知者白日昇天玉寶王上相大司馬高晨師治王寶青靑宮雲繞其房虛煙生其堂自明神燭照其內眾仙玉女三千人侍衞左右宮內北殿上有金格格上有金章鳳璽玉札丹青羽蓋昇仙法服以給成眞之人又有學仙品目進敘及退降簿錄侍仙玉晨典之有知者白日昇天東海青華小童治在玉華清宮紫雲蓋其上日月夾其宇眾仙玉女三千人侍衞左右宮內東殿玉格上有寶經三百卷玉訣九千篇主學仙簿錄應爲眞人者授之玉晨監仙侍郎典者白日昇天東華青宮俯仰之格青童君曰凡學道求仙冝知俯仰之格有知者其名便以逆注青宮當懃心苦念入室燒香存想六門三室之內使分明羅列便叩齒三通仰咒曰上清玄晨三宮六門典我玉名降我神眞龍裙羽章以給我身上昇玉清東華投篇名刻金格長爲帝賓畢嚥炁九過止如此九年尅得眞靈下降玉女見形玄雲綠軿來迎子身凡修此道不得履淹入穢常當清齋念眞眞旡不降其法祕要不得妄傳傳非其人殃及七玄身被風刀之栲眞人投簡正儀凡學道道成皆先詣東華青宮投金簡更受仙號當至神華玉門未至門夾門有兩玉闕當伏闕左投簡須臾當報便起進門下又伏門左須臾當有四眞人出引前便起直進方諸青宮伏於階下臨時自當有侍者唱讚聽唱便起再拜眞人引上殿上當從南階左行上伏於殿前須臾當有領仙玉郎齎金簡紫籍來校定玉名名叅紫簿卽授玉札更署眞仙之號上昇玉清羽童丹青飛裙金眞玉光流金火鈴玉童玉女各三十六人仙官三十六人受署畢便起再拜退還階下又再拜至門止又再拜皆向宮也至時自當有所主統所治住止遊於五嶽之儀格也此青宮舊格不得妄傳未成眞人者詣東華方諸青宮上相青童君几前某嶽先生王甲年如干𡻕一名某字甲某月生右金簡儀書一簡上此學道道成上詣青宮投金簡受署眞仙上格上相藏於玉寶之宮不傳下世若有得者便是骨相合仙名應玉格自然亦得上昇青宮也此法尤重不得妄宣有犯被拷三官深宜愼之上清金闕宮俯仰之格上清金闕宮在三元宮之北相去五萬里高上所處之東去玄羽野西𡾩山九千里處玉清之西與天關連臺外有四門門有兩闕一闕金一闕玉皆夾門左右門有羽衣守士各三百人獅子巨獸各三百首內有清精玉芝流霞之泉東門名玉景金融門門有二玉晨王執九節之麾各鎭一半高上玉清虛皇太眞之賓出入之所經南門名洞寶瓊雲門主眞人飛仙遊宴八極周行五嶽出入之所經西門名玄京玉寶門主學仙受署眞人進敘錄簿所由經也北門名朔陰極雲門主眞人犯非退降偏皇之任學素簡所經由也凡有四門門有兩闕金闕在左玉闕在右並高九千丈金闕以金爲柱紫雲爲蓋刻金題闕眾眞飛仙之號玉闕以青玉爲柱綠雲爲蓋刻玉題闕上皇太眞之號八闕悉如是闕下則有青龍白虎處在左右天獸巨虬備衞玉闕玉童玉女各三百人散香其間闕上有九層金臺虛上玉晨領仙君所住門內周迴七千里金闕宮處在中央中有金輝紫殿瓊房玉室後聖金闕帝君所住紫雲廕其上綠霞繞房日月夾照神燭自明金眞玉女散香虛庭流光八玄風鼓玄旌迴儛旄蓋玉樹激音琳枝自籟百響互生此金闕之上館眾眞之所經其有四極眞人主領學仙簿錄進敘退降及始學儀則皆由四極眞人也眞人奉玉札儀格夫學道道成皆詣東華青宮校定金名退更清齋三月書玉札一枚詣金闕謁金闕帝君儀法當於洞寶瓊雲門外投玉札伏地須臾待報便起再拜四極眞人當引入進金闕下又在金闕左玉闕右伏地須臾眞人引進紫殿當從左行繞玉景金融門過東南行上登殿下伏階左領仙玉郎以紫鳳丹章飛行玉清飛青羽蓋丹錦飛裙十絶龍幡使登三元宮流金火鈴玉札金章令召千靈流雲玄霞九龍玉輿受號眞仙飛行太空侍唱儀則事畢便起再拜揖謝三過此受號而已未得便見帝君畢當直行詣朔陰極雲門金闕下東向伏地稱遊學先生王甲今受帝君眞仙之號不勝喜慶謹詣闕謝聞乞丐虛上玉晨領仙君記名玉闕係在眞仙之次起再拜次詣玄京玉寶門金闕下南向伏稱如上法次詣洞寶瓊雲門金闕下西向伏稱如上法次詣玉景金融門金闕下東向伏稱如上法詣四門八闕畢還從玉景金融門外更再拜伏地四極眞人當齎金札玉章授其身時自當有五嶽仙官雲車來迎也其時自當有所之方面掌統靈嶽之任也詣玉清金闕宮後聖帝君几前某嶽先生臣王甲年如干嵗字某甲右金簡文書一簡上眞人謁金闕投簡受號上法此學道道成上詣金闕謁金闕帝君更受眞仙之號拜謝儀則帝君常所寶祕以授成眞人之者不傳下世有得金闕宮名及金簡儀則此名逆注金格亦自然得登金闕也金闕宮門名此皆九天之隱名於地上之音異故高上虛皇道君經易有九天之上西北門名易有去玄京寶門三千五百里然運明梁之炁二門相通也眾眞之所遊敘次之所關旣登易有之門便上昇帝堂得謁玄景玉寶便得進朝三元學者未登此門宜知門名若徙涉山林絶志人間而不知門戸之所由天眞之儀格何由得登金闕之宮夫存思之道不知神名所在神固不降欲登金闕上詣東華不知其名格宮因何登此乃出九天之上祕於金闕之裏知之者不死得者飛仙學者成眞人世間不學之士有知金闕宮名天下三界稱善萬神禮形千妖喪目而况於積學之家耶其道寶貴不得輕傳非其人殃及七祖已身受考旡復仙冀矣眞人披天關飛仙上法天關者是九天之生門也治在九天東南角一名天圖一名天關故爲三關也眾眞之所經神仙之所厯學者之由也其去金闕五千里玉清上宮七千里得披三關便得上登金闕遊宴玉清也第一天關上有九層玉臺去地一千二百丈下有長蛇數千飛龍毒獸備守玉關巨士三千人皆備交金之領奮牡門端太虛玉晨監字虛上明處在玉臺之上飛雲流霞夾映其房日月玄照光洞玉清侍者眞仙三百人主上眞出入開關所由第二天圖上有六層玉臺高九百丈下有長虵數千飛龍毒獸備守玉關巨士三千人皆備交金之領夾門兩端太上監眞玉郎字玄上伯鎭在玉臺之上丹雲紫蓋欝房玄光日月映其間侍者眞仙三百人主監眾眞遊宴之所經第三天關上有三層玉臺高六百丈下有長虵數千飛龍毒獸備守玉關巨士三千人皆備交金領夾衞兩端太帝監眞玉司郎字旡常生領生玉臺之上玄雲蓋其上虛煙馥其庭自明之光煥其形侍者眞仙三百人主上天眾眞地下眾眞簿錄簡籍所關由之凡受投金簡玉名之道當修披天關之法常當朝夕入室燒香叩齒十二通東向心拜四方存思見九天之端三關之下厯然分明都盡次存七星在天之上隨運而轉我身在天關星上七星運我身至天關玉臺之下便投玉札一枚奏名太虛玉晨監自通見玉晨監以札記著玉格之上通我身至天圖之下次存我身還七星之上七星運我至天圖玉臺之下便投玉札一枚奏太上監眞玉郎前自通見監眞玉郎以札記著玉格之上通我身在天關之下次存我身還七星之上七星運我至天關玉臺之下便投玉札一枚奏太帝監眞玉司郎前自通見監眞玉司郎以札記著玉格之上通我身至金關之下玉清之宮次存失去七星身在空玄之上溟涬之中無所倚見須臾覺在金闕玉景金融門之上投金札一枚見四極眞人以玉案承札入奏金闕帝君前四極眞人報與我俱登玉清之上次存玉清之上四極溟然旡崖唯見青炁鬱鬱仰亦旡天俛亦旡地唯見中央有金門四達內有瓊宮玉玄金枝夾生兩邊巨龍走獸遊戲其巓存我周遊其間良久覺如睡眠已遠寢床身中覺怳怳惚惚如體蹈空存遊洞都畢便叩齒三十六通仰天咒曰三華寶曜玉都開明玄暉敷陳映監旡形金簡綠字尅奏玉名朗覩九天上戲三清天關三圖迴登紫庭金闕受號東華記生得乘八景叅御飛軿畢嚥炁九過止凡學之人而不知披天之關奏簡記名之道萬亦旡成也三關總統諸天諸地上眞飛仙及始學簿錄莫不經於三關者也凡積學之徒能使九天三關有玉名三關玉晨奏於太上大帝之宮帝君自當遣玉童玉女各十二人營衞子身此太帝之上篇以傳天帝君天帝君以傳南極上元君南極上元君以傳太微天帝君太微天帝君以傳金闕帝君金闕帝君以傳上相青童君使教後學應爲眞人者依玄科七百年內聽得三出上元君以西華玉女九十人衞在南極紫房之內青童君曰有骨相應玄得見此道知有投簡之法便成眞人但其科尤重不得輕泄夫學者積億遇眞者幾人故中央黃老君云得見大洞眞經三十九章便白日昇天而有脩之者積年旡成便謂經之不眞此皆坐由東華旡有金簡之目金闕旡有玉札之名眞不爲其降而爲天魔所乘故有不感之效徒得神經萬亦不成矣向使先奏金簡於青宮奉玉札於帝皇得給金晨玉童西華玉女侍衞靈文普下諸天諸地三界稱善詠章萬遍豈不有致瓊輿紫軿之感耶披三關投玉札昇仙上文詣天關玉臺太虛玉晨監几下某郡縣里鄕眞人王甲年如干嵗字某甲指天圖玉臺太上監眞玉郎几下某郡縣鄕里眞人王甲年如干𡻕字某甲詣天關玉臺太帝監眞玉司郎几下某郡縣鄉里眞人王甲年如干嵗字某甲右書三玉札上令長一尺六寸披金闕投玉札昇仙上文詣金闕宮玉闕帝君几前某郡縣鄉里眞人王甲年如干𡻕字某甲某月生右書玉札上令長一尺六寸靑童君云旡有金簡者銀木亦可當无有玉札者桐木亦可當但令精好直理无關節耳靑童君曰存披天關天圖天關上登靑宮金闕玉清之道當書玉札先入室叩齒十二通東向讀札畢仍備修存念之道畢取札祕於雲錦之囊常燒香左右不得輕露此上眞之至號玉郎之靈篇也若有金名玉字逆注靑宮得見此道當依太眞之科齎金簡玉札各一枚長一尺六寸廣二寸四分金龍玉魚各一枚紫繒百尺靑紋四十尺以爲太眞之盟奉有經之師師東向受者北向告北帝爲盟告七祖爲誓約不宣泄之信當依玄科七百年內三傳傳非其人七玄之祖長充鬼役身没九泉萬不得仙篤志之士希仙之夫當案科而奉眞依文而修焉
