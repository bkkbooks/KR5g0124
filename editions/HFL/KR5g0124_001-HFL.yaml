front:
  text: 洞眞上清青要紫書金根衆經卷上右三
  hash: sha256:faa96211927c8a4a6387527311b9627e98765b57b7144668992c52aef49846d3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0124_HFL_001-001a, image: hfl/1026/1026-142.png}
body:
  text: 上相青童君撰青要帝君者乃九陽元皇玉帝之弟子以中皇元年𡻕在東維天始告暉君育於玄丘玉國无崖之天瓊林七寳之下溟濛九域之濵法化應圖三日啓晨厥姓尭諱字曰伯開仍有九龍翼君側七色瓊鳯廕君身神驎含芝以玄哺天女吐精以觀眞玉童擲華以却穢神妃散香以攘塵含嗽以胎息法秀自然華冠二六面發金容體生靈符言韻金章七十二色洞暎玉清三晨麗景六炁齊軿玄雲紫蓋生乎房飛精流光照其庭含眞獨操熈頥靈嵎容序順化隨運沉浮栖心明霞之境敖浪玉國之墟執抗元皇之策落景九域之丘逍遥流盻遂經累劫方還清齋雲房之間以紫雲爲屋青霞爲城黃金爲殿白玉爲床五炁交結髙臺連甍玉陛文階鳯闕四張金童侍側玉華執巾天仙羅衛五千餘人僃天之狩羽騎如鱗龍虎辟邪偶偶𩀱蹲玄炁九會靈風揚煙芳香激天虚生瓊宫流精玉光洞暎十天蕭條髙暢獨演靈篇餐精嚥炁咀嚼玄根服餌還白玉酒金液流精玉林結華日月皇泉鍊骨易髓舉體成眞元陽元皇玉帝君時乗碧霞九鳳飛輿瓊輪羽蓋從桑林千真萬乗億騎飛行侍仙三十六人宴景霄庭來降於君與君共登九老仙都之京九曲之房命西臺龜毋開雲鳯之藴紫錦之囊出紫書眞訣玉篇以授於君君修行道備位登玉清太上大道君授君飛雲羽蓋流紫鳯章金眞玉光豁落七元金神虎符流金火鈴青精玉璽九色无縫之章單青羽裙飛行上清於是縱景萬變廻轉五晨䇿虚召月攝日揚輪洞化離合與眞同靈解形遯變儵欻億千上登三元朝謁玉宫遊覽无崖胤洛九天出入洞門攜契玉仙仰禀髙上元始太眞應炁順命位掌帝晨總統萬道无仙不關下攝十天山靈河源五嶽四海莫不上𨽻於君自飛常圖於紫虚金名於青宫紫書不可得而闚金根不可得而聞也青要是紫清帝君之别號受元皇玉帝紫書妙訣皆衆經之要秘九天之上書八會之𨼆文也玉帝命髙上值眞總仙君科集寳目合爲衆經以紫筆繕文金蘭爲篇皆出上皇玄古之道髙聖所撰集集以成卷傳於青要帝君帝君傳上虚皇元靈道君道君傳太素髙靈洞曜道君道君傳南極上元君上元君傳天帝君天帝君傳太微天帝君天帝君傳後聖九玄帝君九玄帝君傳上相青童君掌籙瓊宫夫有宿命應見此文者皆玄挺開會必有神仙定籙也玉帝寳秘不傳於世妄說之者則九天㓨奸奏於帝君言子之罪太上使五帝神兵罰子之身死爲下鬼充塞河源七祖父毋受拷水官學者慎科祕而奉焉若有金骸玉骨名書帝録得見此文當依九眞玄科修行法度案盟齎信金龍玉魚各一枚紫繒百尺青紋四十尺詣經師𧵥而授之師與弟子對齋七百日按科七百年有人聽得三傳不依科文輕泄祕篇身沒鬼官七祖充責萬不得仙凡修上眞之道披詠黃庭玉景萬遍之根通釋三宫開明幽關乃得修行紫書玉訣招眞致靈白日昇玄之法紫書訣言凡修上眞之道當行上清玉霞紫暎内觀上法常以本生上旬之日沐浴清齋盛潔法服平旦入室以内觀開明玉符清華之水東向洗眼并嗽蕩口腹令内外清虚口无餘味腹无餘薰眼无餘視體无餘塵泊泊靜黙唯道是身然後還南向平坐瞑目内思紫炁出兆頭頂之上勃勃衝天氣冠已形内外鬱冥便引紫炁仰嚥三十九通覺熱隨嚥入兆口腹之中嚥訖開眼朗然豁除便叩齒三通仰呪曰上清流霞暉眞吉旦紫雲暎靈陽積交煥内注金門玉户受觀寳神和藏魂魄无散明皇九眞八道流羡攀雲招虚靈降紫漢洞徹幽元三晨齊宴遊騰玉堂上拜帝舘畢仰嚥三過止此内觀開明玉符當以朱書白紙投水中東向叩齒三通呪曰天无飛翳地无遊塵玉符蕩穢洗除非眞洞明玄虚招致靈仙畢以水洗目漱口吩内外餘符水悉放之東流紫書訣出上清玉霞紫暎内觀經中篇修之八年紫雲覆兆身目明徹視洞觀九天體生竒光縱景萬變飛行太空此道至妙傳巳成眞人不行於世有金名玄圖緑字東華得有此文祕而奉修眞靈易感招仙易成道僃炁盈白日飛昇慎勿輕傳以泄靈篇本生上旬之日者甲子旬生當以甲寅日爲上旬他皆如之紫書訣言修上清玉霞紫暎内觀之道常以月生一日取西流水三升盛以金噐銅噐亦佳以眞朱一兩内著水中名曰金精石景水母玉胎之瑛露於中庭至月十五日正中令日精流光玄暎於石景水母日象煥明水母之中東向書流霞開明洞觀玉符投内石景水毋中轉南向叩齒十六通仰呼日魂珠景胎韜緑暎廻霞赤童玄炎飈像凡十六字畢閉眼存日中五色流霞下冠兆身洞煥一形存見日中有一仙人形長八寸頭戴朱陽赤冠衣絳錦丹裙下在兆身頭頂之上口引日中赤丹金精石景水毋之𤤠灌漑兆形便臨所盛水中暎日光而微呪曰耀羅丹陽元景敷陳赤鑪大明九炁齊眞三五運精二象交纒玉胞石髓鍊故反新流霞玄注水毋凝神和魂柔魄内外同煙仰餐丹華口啜日根靈芝盈溢面彂金仙與炁同軀與日同存乗景飛空上造帝晨畢仰向日十六嚥止取石景水毋之𤤠向日洗目并沐浴形軀餘水放之西流行此九年面有金容内外洞徹與日同光飛行玄虚上造日門此道髙妙不傳下世輕泄寳文罰以鬼兵身沒鬼官七祖獲殃此流霞開明洞觀玉符東向朱書白紙上叩齒十二通呪曰太陽九道八眞齊明三五廻化混合丹靈石景玉胞朱丹之精採納飛玄來降我形長與三晨同死俱生畢以符投於石景水毋之中右上清玉霞紫暎内觀上法一名金精石景水毋玉胞經一名採服日根招霞之道帝君常所寳祕紫筆書文紫金爲簡封於太上九老仙都之房瓊宫玉室之内依科七百年一出有金名玄圖緑字上清得見此文帝遣太陽金童十二人侍衛巳身修行九年尅得上仙白日昇天遊宴玉宫也紫書訣言修上清玉霞紫暎内觀之道白日昇玄之法常以月生三日取東井皇華之精三升井華水也盛以金噐之中銅噐亦佳露著中庭至月十六日夜半令月精光玄暎於皇華丹景洞明皇華之中兆東向書黃炁陽精洞明靈符投著皇華噐中轉西向叩齒二十四通仰呼曰月魄曖簫芬豔翳寥婉虚靈蘭鬱華結翹渟金清營炅容臺標凡二十四字畢閉眼存月中五色流精紫光下冠兆身洞匝一形存月中有一眞人形長九寸頭戴紫冠通身衣黄錦飛帬下在兆頭上口引月中皇華以灌激兆形便臨皇華噐中暎月光而微呪曰靈舒耀華三五洞清紫黄交降二炁混并天元離合運度𧇊盈皇芝流溢黄胎結精景中眞人陶灌我形月君夫人固我黄寧玉佩金鐺使我徹明與月俱𧇊與月俱生長餐皇華昇入帝庭浮遊太空匡御飛軿上享无極億劫兆齡畢仰向月二十四嚥止取皇華向月洗目及通身自盥洗畢餘殘悉放東流之水行此九年目覩空洞徹見萬里逆究吉凶錬容易體面有玉精體生紫光乗空駕虚飛行上清此道髙妙不傳下世輕泄寳文罰以神兵身沒幽泉殃流萬世長充鬼官此黄炁陽精洞明靈符東向以黄筆書青紙上叩齒十二通呪曰陽藏隂生二炁交周天元混合三五應符服御皇華靈降我軀長享景炁與神同休落巳九玄叅駕飛浮畢以符放皇華之中右上清玉霞紫暎内觀上法一名藏天隱月玉胎之經一名八素眞經服月皇華帝君常所寳祕紫筆書文紫金爲簡封於太上九老仙都之房瓊宫玉室之内依科七百年一出有金名玄圖緑字上清得見此文帝遣西華玉女十二人侍衛兆身修行九年尅得上仙白日昇天遊造帝房也凡行此道未至三日皆沐浴蘭香清齋别房不交人事静思眞靈對景霄晨至日行事如覩帝顔積感髣髴尅日化仙若天隂无日亦可於室思而行之道在精思故感而致焉紫書訣言修行上眞之道當以三月九月十二月三日十五日二十五日一年三月月三過行之此月是九天元父受化之月日是逰宴九天上宫值合之時也每至其日沐浴清齋於𨼆寂之地不關人事正中時向東北之上仰天思九天元父姓名身長九寸九分著玄黄素靈之綬頭戴七稱朱玉之幘无極進賢之冠居九天之上太極瓊宫玉寳之府丹靈郷洞元里中時乘碧霞飛輿從十二飛龍二十四仙人匡鵠侍輪逰於虚玄之上存思分明令如對顔便九拜於元父三過隂喚元父甲今有言乞與上昇奉侍帝靈輙叩齒九通仰呪曰髙上帝尊元始大神合眞胤炁形秀紫天乗雲駕浮落景八煙廻輪曲降道廕我身得乗霄景奉侍靈轅今日八㑹上願開陳所乞所啓莫不如言長享元吉與帝同存畢仰嚥九炁止如此元父感恱帝尊欣喜即命領仙注子金名九年精思尅遣瓊輿下迎子身白日飛昇上造帝晨此道髙妙如下世凡學所可叅聞自无金名玄圖緑字上清莫得知見若於機㑹遇得寳篇皆宿挺合仙但當寳録宻而奉行輕說非眞羅延七祖父母長閉地獄萬劫不原身沒鬼官萬不得仙紫書訣言凡修上眞之道當以二月七月十月月五日十六日二十九日一年三月月有三日此月是九天玄母合化始生之月日是天元合慶變雌天德之日也是其日沐浴清齋别室寂䖏不關人事夜半露出中庭西南向仰天思九天玄母姓名身長六寸六分著青寳神光錦繡霜羅九色之綬頭戴紫元玄黃寳冠居九炁无極之上瓊林七暎之宫玉寳洞元之府九光郷上清里中時乗紫雲飛精羽蓋從十二鳳凰三十六玉女匡鳯侍仙逰於太清之上无崖之中存思分明朗然對前便九拜於玄母三過隂喚玄母甲穢質貪眞仰慕上清乞與盻接得侍玉靈叩齒九通仰呪曰三合五離混化二元炁凝成神神變合魂胎養九天保固生門隂精玄降淘灌形源鍊質染炁受化自然今日何日玄母開陳八願九會上獲天眞景響參微得啓玉晨骨騰肉飛乗虚絡煙上造紫轅長輔帝臣畢仰嚥九過止如此玄母含暢帝妃憘懽天眞下降得見靈顔即命青宫注上玉名九年精思帝遣玉女乗雲下迎上昇玉清侍衞玄宫此道髙妙非世所聞若有金名標侍帝簡得見此文皆宿挺合仙尅得飛昇遊宴九天也慎勿輕宣身没三官七祖被拷長閉河源凡行此道皆當精心苦念目瞻靈顔仰希玄降以要飛仙不得汙穢上干太眞身被禁閉萬不得仙若天隂无日亦可於静室行事但使心目相應口響相和神无不感道无不降學无不成道降神附飛行太空也紫書訣言凡修上眞之道常以九月九日七月七日三月三日此日是九天眞女合慶玉安遊宴霄庭敷陳納靈之日是其日五香沐浴清齋隱處别室不交人事夜半露出焼香北向仰思九天眞女諱字身長七寸七分著七色耀雲羅袿明光九色紫錦飛裙頭戴玄黄七稱進賢之冠居上上紫瓊宫玉景臺七暎府金光郷无爲里中時乗紫霞飛盖緑軿丹輿從上宫玉女三十六人手把神芝五色華旛御飛鳯白鸞遊於九玄之上青天之崖思畢心拜眞女四拜叩齒二十四通仰呪曰天眞廻慶遊宴紫天敷陳納靈合運无間上御玉宫下盻兆臣八會開張九願同纒思微立感上𧇊神眞流精陶注玉華降身萬慶无量長種芝田畢仰引炁二十四嚥止如此眞女感恱神妃含懽上列玉帝奉兆玉名記書東華參篇玉清也修之九年面彂金容體暎玉光神妃交接身對靈眞尅乗飛盖遊宴紫庭也此法髙妙世所不行若有金名書字紫簡得見秘文骨挺應仙寳而宻修計日成仙輕泄非眞罰以神兵長後幽泉七祖受累萬劫不原紫書訣言日暉中玄之道常當丙午庚午之日日中時以九寸明鏡一面露却於中庭令日精光暎於鏡中兆以南向面臨鏡上叩齒二十四通呪曰日精耀羅流光暎靈華芒八朗緯絡天庭歴度應運玉胞充盈玄光童子日暉赤精廻眞曲暎停午洞明金鏡採霞混合我形二景同符與日齊并八十一息胃藏華生長保日月天地相傾仰天口注日光引嚥三十六息畢還以面臨鏡上又引嚥鏡中日精四十五息畢還合八十一息也此日暉中玄之道也行之三年目中童子有流紫玉光徹見萬里洞鑒无窮面如赤丹體發金容行及日影如飛乗空此玉帝上法傳於魯女女採精以登玉庭其法寳秘不得妄傳傳非其人殃及七祖身役下鬼萬不得仙凡修日暉中玄之道若天隂无日亦可别室行事但嚥炁倍於日中也當作百六十二息鏡每令精明勿使塵垢不得妄令他人臨暎此至忌也經三人臨暎則日中童子赤精二君云又下降令人失明神亡可不慎之此法西王母常所修授於青要帝君青要帝君授於魯女魯女傳太陽女太陽女常於世中行之洞覩玄空面生金光年七百嵗上和之年時人謂之年十七八常乗飛鳯遊行天下亦監察有道人或降以眞炁有宿分者或於景響中遇而悟之得接眞形便能飛行紫書訣言凡夫朔㑹之日此以天地二炁交度度周則隂炁勃蕩陽精𧇊降當其日一時之中天分操兵萬眞臨軒五星移度十天同振修日暉中玄之道是其日當露出中庭以明鏡向日兆身操大刀一口南向叩齒三十六通仰呪曰日暉童子陽光赤精耀羅眞人影中玉靈歷運乗炁上下肅清隂貟内謀上侵日庭天臨操仗帝臣輔兵三五正立陽光洞明天地代食何賈敢生各反其位无使𧇊盈玉帝告命靡不敬停便引炁二十四息止如此則天地復位三五齊光童子感恱日暉廻靈流光玄注陶降兆身則列名紫簡記篇玉清九年之内得乗緑軿乗空駕虚飛行上清也紫書訣言凡月蝕之日其夕隂炁𧇊陽炁盈度分相加二景相征此皆天地有離合日月之别炁乗有月𧇊之夕便侵謀於正炁也當此之時皆五星宿帝晨部司勒命太隂齊兵衛靈是其夕當出中庭取清水一瓫兆身操刀一口臨水向月叩齒十六通呪曰天地羅合負氣乗𧇊侵蝕月廬上干黄輝帝臣操杖玉晨捕非天兵羅域神公放威有何賈生附景乗微速反𥘉位无使有違畢三過向月呪如此以刀右廻瓫水三過止臨水引炁十六嚥畢月蝕即觧天景肅清三五齊輝萬宫安寧也月中眞人夫人靈光感恱意懽廻靈玄暎降子之情即記北帝落子死名注上清宫玉篇給子玉女十二人侍衛兆身九年如此得乗飛霞上造月庭其道至妙不行於世得者寳祕慎勿輕傳此帝君紫書上法王靈子所修項上常生紫光洞照十里中兩目有流精如星暎照面發金容夜灼虚明役使太陽金童太隂玉女各十二人其法至祕不得輕傳若天隂不見日月者亦於室内行此日潜相謀犯不可不救於正景也紫書訣言凡修上清之道未能騰景霄庭宴駕紫虚始欲渉學雖託志幽阜長齋窮林猶不免於陽九之災承唐之年也元始天王度厄寳眞玉符將可以防度此災此符與九天俱生日月俱存渉洪泉而不沉履猛火而不燒經白刄而不傷夀萬嵗而方翹佩之九年形變易容體生竒光乗空飛行上昇玉清依四極明科七百年有金名玉字紫簡青宫聽傳三人輕泄不眞身没鬼官栲延七祖長閉幽泉萬劫不原大劫度厄寳命長存符右元始九玄之精經太陽九會洪水滔天當以青書白絹佩之頭上浮翔清波之上萬災不能傷保身長命乆佩神仙小劫度厄寳命長存符右九天太眞符經小陽九之周水火交横萬災並興當以朱書白絹佩之左肘入淵不沉入火不燃萬災不能害保身長命與天同夀乆佩神仙大百六度厄寳命長存符右上皇玉天符經大百六之厄朱書白絹佩之頭上流災暴厄所不能傷保身長命夀同三光佩之九年白日飛仙上昇太清小百六度厄寳命長存符右髙上紫虚玉符經小百六之厄黃書白絹佩之左肘左千妖萬精疫癘横流災所不能傷保身長命夀同天地佩之九年白日飛昇隂陽度厄寳命長存符右三天童子玉符經天地攺度萬癘交横水火兵病千灾並行黒書白絹佩之與天同年與日月光九年飛行上昇太清右度厄寳命長存符以元始天王傳於九成公九成公者乃九天丈人身長九尺目圎口方聲如雷頂有紫光暎照十天洞徹太无左右侍女二十四人著九色斑丈之裘頭戴紫晨之冠座紫虚之上空玄之中時乗飛鳯玄龍遊於白水沙州空山之上自公受符以經七千餘劫屢履陽激隂否百六之周浩翔洪波之上而无厄㑹之憂召水毋以填源命九河而止流勑隂官而自迎役六丁以自扶制五嶽爲玄梁導羽騎以汎舟逍遥清虚極意遨遊承天歷數法傳後賢若有玄圖於帝簡緑字於上清當得此文得者位同靈仙超度百六白日昇晨帝給玉童玉女各十二人傍衛巳身惟當寳祕愼勿輕傳受符師弟子對齋九日或三日資白絹年一尺紫紋三十二尺以誓九天之信建日夜半露於中庭北向清酒一升脯一勾棗五十枚九桮中一請符案上師叩齒三十四通奉請九天使者鑒眞大夫令有眞人男女某甲好樂神仙生值季世萬灾流行謹受上符度命長存佩身之後與眞通靈免過厄難得爲上眞乗空駕虚飛翔太清以符授弟子畢也餘饌隨意所散紫書訣言凡修上清之道兆身父母伯叔兄弟於世上死亡兆身未得絶跡故在人中身履死穢者三日當取清水一瓫眞朱一兩投於水中兆於庭中南向臨水叩齒九通呪曰氣化成神尸變入玄三化五鍊昇入九天之劫更度甲身甲身更化得爲眞人畢男死思玉童三人女死思玉女七人請瓫水以灌死人之尸畢取水自洗手面仰天吩嗽畢又隂呪曰天氣已清人化己生得生上天九變受形五苦三塗斷落死名超度窮魂還反南庭止如此亡人即更受化生於九天之上九年得昇玉清之宫其法妙於大洞度七祖之法玉帝所祕不傳非人有金名帝圖緑字紫文不得見此丈未經施用輕告於人七祖父母長閉鬼官三塗五苦萬劫不原四極明科七百年有眞人聽傳紫書訣言凡上學之士遊行世路忽於道次遇見死尸穢炁干身兆當行二十四歩止正北向叩齒九通男尸思玉童三人女尸思玉女七人來請兆玉谷之中皇芝素水以灌彼死尸之上須㬰存死尸更生成人便隂呪曰已枯後榮已滅復生得生上天更禀太靈九天之劫反覆胎嬰穢累蕩滅白尸反生畢手拭目二七過止如此穢炁即觧死人即更受化後爲靈人也兆遇二十四過行此鍊呪功滿德加名標上清二十四年剋乗雲輪飛行九玄也紫書眞訣出自上皇玄古之道髙聖所撰元皇玉帝以傳青要帝君此訣標於妙用集爲金根衆經太帝以金晨玉童西華玉女各二十四人侍衛靈文記功明善有犯上科奏罪於玉帝告下五帝神兵罰子之身七祖被拷長閉河源奉者慎焉洞眞上清青要紫書金根衆經卷上
