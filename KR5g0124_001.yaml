front:
  text: 洞真上清青要紫書金根衆經卷上右三
  hash: sha256:3392233b1c9ff33a2cac5f16458a05a1a45592dc1de3527cd5188ccd1e74ed02
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0124_HFL_001-001a, image: hfl/1026/1026-142.png}
body:
  text: 上相青童君撰青要帝君者乃九陽元皇玉帝之弟子以中皇元年歲在東維天始告暉君育於玄丘玉國無崖之天瓊林七寶之下溟濛九域之濵法化應圖三日啓晨厥姓堯諱字曰伯開仍有九龍翼君側七色瓊鳯廕君身神驎含芝以玄哺天女吐精以觀真玉童擲華以却穢神妃散香以攘塵含嗽以胎息法秀自然華冠二六面發金容體生靈符言韻金章七十二色洞映玉清三晨麗景六氣齊軿玄雲紫蓋生乎房飛精流光照其庭含真獨操熙頥靈嵎容序順化隨運沉浮栖心明霞之境敖浪玉國之墟執抗元皇之策落景九域之丘逍遙流盻遂經纍劫方還清齋雲房之間以紫雲為屋青霞為城黃金為殿白玉為床五氣交結髙臺連甍玉陛文階鳯闕四張金童侍側玉華執巾天仙羅衛五千餘人僃天之狩羽騎如鱗龍虎辟邪偶偶雙蹲玄氣九會靈風揚煙芳香激天虛生瓊宫流精玉光洞映十天蕭條髙暢獨演靈篇餐精咽氣咀嚼玄根服餌還白玉酒金液流精玉林結華日月皇泉鍊骨易髓舉體成真元陽元皇玉帝君時乘碧霞九鳳飛輿瓊輪羽蓋從桑林千真萬乘億騎飛行侍仙三十六人宴景霄庭來降於君與君共登九老仙都之京九曲之房命西臺龜毋開雲鳯之藴紫錦之囊出紫書真訣玉篇以授於君君修行道備位登玉清太上大道君授君飛雲羽蓋流紫鳯章金真玉光豁落七元金神虎符流金火鈴青精玉璽九色無縫之章單青羽裙飛行上清於是縱景萬變回轉五晨䇿虛召月攝日揚輪洞化離合與真同靈解形遁變倏欻億千上登三元朝謁玉宫遊覽無崖胤洛九天出入洞門攜契玉仙仰稟髙上元始太真應氣順命位掌帝晨總統萬道無仙不關下攝十天山靈河源五嶽四海莫不上𨽻於君自飛常圖於紫虛金名於青宫紫書不可得而窺金根不可得而聞也青要是紫清帝君之别號受元皇玉帝紫書妙訣皆衆經之要祕九天之上書八會之隱文也玉帝命髙上值真總仙君科集寶目合為衆經以紫筆繕文金蘭為篇皆出上皇玄古之道髙聖所撰集集以成卷傳於青要帝君帝君傳上虛皇元靈道君道君傳太素髙靈洞曜道君道君傳南極上元君上元君傳天帝君天帝君傳太微天帝君天帝君傳後聖九玄帝君九玄帝君傳上相青童君掌籙瓊宫夫有宿命應見此文者皆玄挺開會必有神仙定籙也玉帝寶祕不傳於世妄説之者則九天刺姦奏於帝君言子之罪太上使五帝神兵罰子之身死為下鬼充塞河源七祖父毋受拷水官學者慎科祕而奉焉若有金骸玉骨名書帝録得見此文當依九真玄科修行法度案盟齎信金龍玉魚各一枚紫繒百尺青紋四十尺詣經師𧵥而授之師與弟子對齋七百日按科七百年有人聽得三傳不依科文輕泄祕篇身沒鬼官七祖充責萬不得仙凡修上真之道披詠黃庭玉景萬遍之根通釋三宫開明幽關乃得修行紫書玉訣招真致靈白日升玄之法紫書訣言凡修上真之道當行上清玉霞紫映內觀上法常以本生上旬之日沐浴清齋盛潔法服平旦入室以內觀開明玉符清華之水東向洗眼并嗽蕩口腹令內外清虛口無餘味腹無餘薰眼無餘視體無餘塵泊泊靜默唯道是身然後還南向平坐瞑目內思紫氣出兆頭頂之上勃勃衝天氣冠已形內外鬱冥便引紫氣仰咽三十九通覺熱隨咽入兆口腹之中咽訖開眼朗然豁除便叩齒三通仰呪曰上清流霞暉真吉旦紫雲映靈陽積交煥內注金門玉户受觀寶神和藏魂魄無散明皇九真八道流羡攀雲招虛靈降紫漢洞徹幽元三晨齊宴遊騰玉堂上拜帝館畢仰咽三過止此內觀開明玉符當以朱書白紙投水中東向叩齒三通呪曰天無飛翳地無遊塵玉符蕩穢洗除非真洞明玄虛招致靈仙畢以水洗目漱口吩內外餘符水悉放之東流紫書訣出上清玉霞紫映內觀經中篇修之八年紫雲覆兆身目明徹視洞觀九天體生竒光縱景萬變飛行太空此道至妙傳巳成真人不行於世有金名玄圖緑字東華得有此文祕而奉修真靈易感招仙易成道僃氣盈白日飛升慎勿輕傳以泄靈篇本生上旬之日者甲子旬生當以甲寅日為上旬他皆如之紫書訣言修上清玉霞紫映內觀之道常以月生一日取西流水三升盛以金器銅器亦佳以真朱一兩內著水中名曰金精石景水母玉胎之瑛露於中庭至月十五日正中令日精流光玄映於石景水母日象煥明水母之中東向書流霞開明洞觀玉符投內石景水毋中轉南向叩齒十六通仰呼日魂珠景胎韜緑映回霞赤童玄炎飈像凡十六字畢閉眼存日中五色流霞下冠兆身洞煥一形存見日中有一仙人形長八寸頭戴朱陽赤冠衣絳錦丹裙下在兆身頭頂之上口引日中赤丹金精石景水毋之𤤠灌溉兆形便臨所盛水中映日光而微呪曰耀羅丹陽元景敷陳赤爐大明九氣齊真三五運精二象交纒玉胞石髓鍊故反新流霞玄注水毋凝神和魂柔魄內外同煙仰餐丹華口啜日根靈芝盈溢面彂金仙與氣同軀與日同存乘景飛空上造帝晨畢仰向日十六咽止取石景水毋之𤤠向日洗目并沐浴形軀餘水放之西流行此九年面有金容內外洞徹與日同光飛行玄虛上造日門此道髙妙不傳下世輕泄寶文罰以鬼兵身沒鬼官七祖獲殃此流霞開明洞觀玉符東向朱書白紙上叩齒十二通呪曰太陽九道八真齊明三五回化混合丹靈石景玉胞朱丹之精採納飛玄來降我形長與三晨同死俱生畢以符投於石景水毋之中右上清玉霞紫映內觀上法一名金精石景水毋玉胞經一名採服日根招霞之道帝君常所寶祕紫筆書文紫金為簡封於太上九老仙都之房瓊宫玉室之內依科七百年一出有金名玄圖緑字上清得見此文帝遣太陽金童十二人侍衛巳身修行九年尅得上仙白日升天遊宴玉宫也紫書訣言修上清玉霞紫映內觀之道白日升玄之法常以月生三日取東井皇華之精三升井華水也盛以金器之中銅器亦佳露著中庭至月十六日夜半令月精光玄映於皇華丹景洞明皇華之中兆東向書黃氣陽精洞明靈符投著皇華器中轉西向叩齒二十四通仰呼曰月魄曖簫芬豔翳寥婉虛靈蘭鬱華結翹渟金清營炅容臺標凡二十四字畢閉眼存月中五色流精紫光下冠兆身洞匝一形存月中有一真人形長九寸頭戴紫冠通身衣黃錦飛裙下在兆頭上口引月中皇華以灌激兆形便臨皇華器中映月光而微呪曰靈舒耀華三五洞清紫黃交降二氣混并天元離合運度𧇊盈皇芝流溢黃胎結精景中真人陶灌我形月君夫人固我黃寧玉佩金鐺使我徹明與月俱𧇊與月俱生長餐皇華升入帝庭浮遊太空匡御飛軿上享無極億劫兆齡畢仰向月二十四咽止取皇華向月洗目及通身自盥洗畢餘殘悉放東流之水行此九年目覩空洞徹見萬里逆究吉凶錬容易體面有玉精體生紫光乘空駕虛飛行上清此道髙妙不傳下世輕泄寶文罰以神兵身沒幽泉殃流萬世長充鬼官此黃氣陽精洞明靈符東向以黃筆書青紙上叩齒十二通呪曰陽藏隂生二氣交周天元混合三五應符服御皇華靈降我軀長享景氣與神同休落巳九玄參駕飛浮畢以符放皇華之中右上清玉霞紫映內觀上法一名藏天隱月玉胎之經一名八素真經服月皇華帝君常所寶祕紫筆書文紫金為簡封於太上九老仙都之房瓊宫玉室之內依科七百年一出有金名玄圖緑字上清得見此文帝遣西華玉女十二人侍衛兆身修行九年尅得上仙白日升天遊造帝房也凡行此道未至三日皆沐浴蘭香清齋别房不交人事靜思真靈對景霄晨至日行事如覩帝顔積感髣佛尅日化仙若天隂無日亦可於室思而行之道在精思故感而致焉紫書訣言修行上真之道當以三月九月十二月三日十五日二十五日一年三月月三過行之此月是九天元父受化之月日是逰宴九天上宫值合之時也每至其日沐浴清齋於隱寂之地不關人事正中時向東北之上仰天思九天元父姓名身長九寸九分著玄黃素靈之綬頭戴七稱朱玉之幘無極進賢之冠居九天之上太極瓊宫玉寶之府丹靈鄉洞元里中時乘碧霞飛輿從十二飛龍二十四仙人匡鵠侍輪逰於虛玄之上存思分明令如對顔便九拜於元父三過隂喚元父甲今有言乞與上升奉侍帝靈輒叩齒九通仰呪曰髙上帝尊元始大神合真胤氣形秀紫天乘雲駕浮落景八煙回輪曲降道廕我身得乘霄景奉侍靈轅今日八會上願開陳所乞所啓莫不如言長享元吉與帝同存畢仰咽九氣止如此元父感恱帝尊欣喜即命領仙注子金名九年精思尅遣瓊輿下迎子身白日飛升上造帝晨此道髙妙如下世凡學所可參聞自無金名玄圖緑字上清莫得知見若於機會遇得寶篇皆宿挺合仙但當寶録密而奉行輕説非真羅延七祖父母長閉地獄萬劫不原身沒鬼官萬不得仙紫書訣言凡修上真之道當以二月七月十月月五日十六日二十九日一年三月月有三日此月是九天玄母合化始生之月日是天元合慶變雌天德之日也是其日沐浴清齋别室寂處不關人事夜半露出中庭西南向仰天思九天玄母姓名身長六寸六分著青寶神光錦繡霜羅九色之綬頭戴紫元玄黃寶冠居九氣無極之上瓊林七映之宫玉寶洞元之府九光鄉上清里中時乘紫雲飛精羽蓋從十二鳳凰三十六玉女匡鳯侍仙逰於太清之上無崖之中存思分明朗然對前便九拜於玄母三過隂喚玄母甲穢質貪真仰慕上清乞與盻接得侍玉靈叩齒九通仰呪曰三合五離混化二元氣凝成神神變合魂胎養九天保固生門隂精玄降淘灌形源鍊質染氣受化自然今日何日玄母開陳八願九會上獲天真景響參微得啓玉晨骨騰肉飛乘虛絡煙上造紫轅長輔帝臣畢仰咽九過止如此玄母含暢帝妃憘歡天真下降得見靈顔即命青宫注上玉名九年精思帝遣玉女乘雲下迎上升玉清侍衛玄宫此道髙妙非世所聞若有金名標侍帝簡得見此文皆宿挺合仙尅得飛升遊宴九天也慎勿輕宣身沒三官七祖被拷長閉河源凡行此道皆當精心苦念目瞻靈顔仰希玄降以要飛仙不得汙穢上干太真身被禁閉萬不得仙若天隂無日亦可於靜室行事但使心目相應口響相和神無不感道無不降學無不成道降神附飛行太空也紫書訣言凡修上真之道常以九月九日七月七日三月三日此日是九天真女合慶玉安遊宴霄庭敷陳納靈之日是其日五香沐浴清齋隱處别室不交人事夜半露出燒香北向仰思九天真女諱字身長七寸七分著七色耀雲羅袿明光九色紫錦飛裙頭戴玄黃七稱進賢之冠居上上紫瓊宫玉景臺七映府金光鄉無為里中時乘紫霞飛蓋緑軿丹輿從上宫玉女三十六人手把神芝五色華幡御飛鳯白鸞遊於九玄之上青天之崖思畢心拜真女四拜叩齒二十四通仰呪曰天真回慶遊宴紫天敷陳納靈合運無間上御玉宫下盻兆臣八會開張九願同纒思微立感上𧇊神真流精陶注玉華降身萬慶無量長種芝田畢仰引氣二十四咽止如此真女感恱神妃含歡上列玉帝奉兆玉名記書東華參篇玉清也修之九年面彂金容體映玉光神妃交接身對靈真尅乘飛蓋遊宴紫庭也此法髙妙世所不行若有金名書字紫簡得見祕文骨挺應仙寶而密修計日成仙輕泄非真罰以神兵長後幽泉七祖受纍萬劫不原紫書訣言日暉中玄之道常當丙午庚午之日日中時以九寸明鏡一面露却於中庭令日精光映於鏡中兆以南向面臨鏡上叩齒二十四通呪曰日精耀羅流光映靈華芒八朗緯絡天庭歷度應運玉胞充盈玄光童子日暉赤精回真曲映停午洞明金鏡採霞混合我形二景同符與日齊并八十一息胃藏華生長保日月天地相傾仰天口注日光引咽三十六息畢還以面臨鏡上又引咽鏡中日精四十五息畢還合八十一息也此日暉中玄之道也行之三年目中童子有流紫玉光徹見萬里洞鑒無窮面如赤丹體發金容行及日影如飛乘空此玉帝上法傳於魯女女採精以登玉庭其法寶祕不得妄傳傳非其人殃及七祖身役下鬼萬不得仙凡修日暉中玄之道若天隂無日亦可别室行事但咽氣倍於日中也當作百六十二息鏡每令精明勿使塵垢不得妄令他人臨映此至忌也經三人臨映則日中童子赤精二君云又下降令人失明神亡可不慎之此法西王母常所修授於青要帝君青要帝君授於魯女魯女傳太陽女太陽女常於世中行之洞覩玄空面生金光年七百嵗上和之年時人謂之年十七八常乘飛鳯遊行天下亦監察有道人或降以真氣有宿分者或於景響中遇而悟之得接真形便能飛行紫書訣言凡夫朔會之日此以天地二氣交度度周則隂氣勃蕩陽精𧇊降當其日一時之中天分操兵萬真臨軒五星移度十天同振修日暉中玄之道是其日當露出中庭以明鏡向日兆身操大刀一口南向叩齒三十六通仰呪曰日暉童子陽光赤精耀羅真人影中玉靈歷運乘氣上下肅清隂貟內謀上侵日庭天臨操仗帝臣輔兵三五正立陽光洞明天地代食何賈敢生各反其位無使𧇊盈玉帝告命靡不敬停便引氣二十四息止如此則天地復位三五齊光童子感恱日暉回靈流光玄注陶降兆身則列名紫簡記篇玉清九年之內得乘緑軿乘空駕虛飛行上清也紫書訣言凡月蝕之日其夕隂氣𧇊陽氣盈度分相加二景相征此皆天地有離合日月之别氣乘有月𧇊之夕便侵謀於正氣也當此之時皆五星宿帝晨部司勒命太隂齊兵衛靈是其夕當出中庭取清水一瓫兆身操刀一口臨水向月叩齒十六通呪曰天地羅合負氣乘𧇊侵蝕月廬上干黃輝帝臣操杖玉晨捕非天兵羅域神公放威有何賈生附景乘微速反𥘉位無使有違畢三過向月呪如此以刀右回瓫水三過止臨水引氣十六咽畢月蝕即解天景肅清三五齊輝萬宫安寧也月中真人夫人靈光感恱意歡回靈玄映降子之情即記北帝落子死名注上清宫玉篇給子玉女十二人侍衛兆身九年如此得乘飛霞上造月庭其道至妙不行於世得者寶祕慎勿輕傳此帝君紫書上法王靈子所修項上常生紫光洞照十里中兩目有流精如星映照面發金容夜灼虛明役使太陽金童太隂玉女各十二人其法至祕不得輕傳若天隂不見日月者亦於室內行此日潛相謀犯不可不救於正景也紫書訣言凡修上清之道未能騰景霄庭宴駕紫虛始欲涉學雖託志幽阜長齋窮林猶不免於陽九之災承唐之年也元始天王度厄寶真玉符將可以防度此災此符與九天俱生日月俱存涉洪泉而不沉履猛火而不燒經白刃而不傷夀萬嵗而方翹佩之九年形變易容體生竒光乘空飛行上升玉清依四極明科七百年有金名玉字紫簡青宫聽傳三人輕泄不真身沒鬼官栲延七祖長閉幽泉萬劫不原大劫度厄寶命長存符右元始九玄之精經太陽九會洪水滔天當以青書白絹佩之頭上浮翔清波之上萬災不能傷保身長命久佩神仙小劫度厄寶命長存符右九天太真符經小陽九之周水火交橫萬災並興當以朱書白絹佩之左肘入淵不沉入火不燃萬災不能害保身長命與天同夀久佩神仙大百六度厄寶命長存符右上皇玉天符經大百六之厄朱書白絹佩之頭上流災暴厄所不能傷保身長命夀同三光佩之九年白日飛仙上升太清小百六度厄寶命長存符右髙上紫虛玉符經小百六之厄黃書白絹佩之左肘左千妖萬精疫癘橫流災所不能傷保身長命夀同天地佩之九年白日飛升隂陽度厄寶命長存符右三天童子玉符經天地攺度萬癘交橫水火兵病千災並行黑書白絹佩之與天同年與日月光九年飛行上升太清右度厄寶命長存符以元始天王傳於九成公九成公者乃九天丈人身長九尺目圎口方聲如雷頂有紫光映照十天洞徹太無左右侍女二十四人著九色斑丈之裘頭戴紫晨之冠座紫虛之上空玄之中時乘飛鳯玄龍遊於白水沙州空山之上自公受符以經七千餘劫屢履陽激隂否百六之周浩翔洪波之上而無厄會之憂召水毋以填源命九河而止流勑隂官而自迎役六丁以自扶制五嶽為玄梁導羽騎以泛舟逍遙清虛極意遨遊承天歷數法傳後賢若有玄圖於帝簡緑字於上清當得此文得者位同靈仙超度百六白日升晨帝給玉童玉女各十二人傍衛巳身惟當寶祕愼勿輕傳受符師弟子對齋九日或三日資白絹年一尺紫紋三十二尺以誓九天之信建日夜半露於中庭北向清酒一升脯一勾棗五十枚九杯中一請符案上師叩齒三十四通奉請九天使者鑒真大夫令有真人男女某甲好樂神仙生值季世萬災流行謹受上符度命長存佩身之後與真通靈免過厄難得為上真乘空駕虛飛翔太清以符授弟子畢也餘饌隨意所散紫書訣言凡修上清之道兆身父母伯叔兄弟於世上死亡兆身未得絶迹故在人中身履死穢者三日當取清水一瓫真朱一兩投於水中兆於庭中南向臨水叩齒九通呪曰氣化成神尸變入玄三化五鍊升入九天之劫更度甲身甲身更化得為真人畢男死思玉童三人女死思玉女七人請瓫水以灌死人之尸畢取水自洗手面仰天吩嗽畢又隂呪曰天氣已清人化己生得生上天九變受形五苦三塗斷落死名超度窮魂還反南庭止如此亡人即更受化生於九天之上九年得升玉清之宫其法妙於大洞度七祖之法玉帝所祕不傳非人有金名帝圖緑字紫文不得見此丈未經施用輕告於人七祖父母長閉鬼官三塗五苦萬劫不原四極明科七百年有真人聽傳紫書訣言凡上學之士遊行世路忽於道次遇見死尸穢氣干身兆當行二十四步止正北向叩齒九通男尸思玉童三人女尸思玉女七人來請兆玉谷之中皇芝素水以灌彼死尸之上須臾存死尸更生成人便隂呪曰已枯後榮已滅復生得生上天更稟太靈九天之劫反覆胎嬰穢纍蕩滅白尸反生畢手拭目二七過止如此穢氣即解死人即更受化後為靈人也兆遇二十四過行此鍊呪功滿德加名標上清二十四年剋乘雲輪飛行九玄也紫書真訣出自上皇玄古之道髙聖所撰元皇玉帝以傳青要帝君此訣標於妙用集為金根衆經太帝以金晨玉童西華玉女各二十四人侍衛靈文記功明善有犯上科奏罪於玉帝告下五帝神兵罰子之身七祖被拷長閉河源奉者慎焉洞真上清青要紫書金根衆經卷上
