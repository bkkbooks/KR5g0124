front:
  text: 洞真上清青要紫書金根衆經卷下右四
  hash: sha256:4c9ba4fa9b4b6ef46708e143505f2137c95e34a5a4217a836a265f7dde17378e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0124_HFL_002-001a, image: hfl/1027/1027-005.png}
body:
  text: 上相青童君撰元始天王經元始天王禀天自然之胤結形未沌之霞託體虛生之胎生乎空洞之際時玄景未分天光冥逮浩漫太虛積七千餘劫天朗氣清二暉纒終玄雲紫蓋映其首六氣之電翼其真夜生自明神光燭室散虛馥之煙栖心霄霞之境鍊容洞波之濵獨秉靈符之節抗御玄降之章內氣玄崖潜想幽窮忽焉逍遙流䀎忘旋瓊輪玉輿碧輦玄龍飛精流靄耀電虛宫東遊碧水豪林之境上𢠾青霞九曲之房進登金闕受號玉清紫虛髙上元皇太上大道君金簡玉札使奏名東華方諸青宫受命總統億津玄降玉華之女金晨之童各三千人飛龍毒獸巨虬千尋玃天奮爪備衛玉關天威煥赫陳于廣庭飛青羽蓋流紫鳳章金真玉光豁落七元神虎上符流金火鈴結編元皇位登玉清掌括上皇髙帝之真道備氣澄仍讃靈篇三十九章玉慧激詞演䆒無窮妙音發於始天玉響啓於洞門故號能書大洞真經其道極尊與元始俱生髙上妙化量難可勝流音億兆而不休經萬劫而方新自無金簡玉名不得參聞後學之徒勤志髙尚棄纍忘塵寂心長阜對景霄晨精齊苦念倦不敢眠奏金簡玉札記名玉清然後得受大洞真經口訣三元立到發音駭動九天有得此章上真之根次有金簡奏札玉郎名參東華便為真人室招虛生之暉堂降百和之煙玉華侍側金晨衛形洞鍳極天之崖協三光以通真運五晨以騁駕䇿飛龍以御輪上登三素之宫拜謁太帝之前髙上元皇之所禀太上大道之極真微乎元始靈化祕文以付上相青童君掌録東華使傳後聖應為真人者其道寶祕不傳下世輕泄神文身沒幽源殃及七玄長充下鬼萬不得仙上相青童君曰金簡玉札出自太上靈都之宫刻玉為札結金為簡書以朱文編以紫繩常以玄雲紫蓋廕其房百和之香散其庭使西華玉女金晨之童各三百人典衛靈文元始天王受於太上大道君其真科七百年三傳凡是學者雖未得此文其名皆巳逆參青宫但無金簡玉字爾領仙侍郎典録玉司常以隂察精粗其有勤尚苦志皆令玄授此文使奏名玉皇三元東華太上當遣真人授其真經後聖衆真莫不先奏簡於東華投玉札於上清然後得受大洞真經精齊苦行上為真人未學之徒青宫無有金簡之録玉格無有玄編之名神經亦不可得而授彼天魔亦不可得而收真靈終亦不降玉女亦不衛子之身今故禀上皇之科抄集品次以為後學開津之徑有心者冝加清齊督志勤尚注念玄真感徹玉皇奏簡青宫便得誦詠神經通釋幽玄太上剋遣丹輿飛軿來迎兆身上登玉清然此經禁戒尤重非真不傳太上常以正月一日七月七日九月九日一年三遣玉晨元皇太極真人領仙玉郎詣東華青宫校定真仙簿録其有金簡玉名者即言奏三元隨學深淺玉童玉女防衛其身若有漏泄輕真慢法為玉童所奏雖有金簡即被除移名鬼官身被風刀之栲七玄之祖運蒙山之石填積夜之河凡積學之士每以其日當夷心寂室清齊靜念散香左右朱書金簡八通紫繩結篇以奏髙上玉皇東華青宫玉札八枚以奏三元先於室內東向叩齒九通讀簡札一過畢口祝上啓太上髙上玉皇三十九帝二十四真甲受生末世久染囂塵感荷先慶福德所鍾得覩真文今奏金簡言名玉清封付靈嶽長為天臣乞白髙上記名三元賜給玉童玉女衛身得乘飛霞上升帝宫畢起再拜奏髙上玉皇金簡上篇某嶽先生王甲字某甲本命某子某月生某年某月朔日子奏金簡紫録玉籍寶文上詣太上髙上玉皇三十九帝二十四髙真金簡紫輝玉景瓊宫右書紫文上一尺連金簡頭係髙上虛皇玉清東華青宫真人王甲稽首再拜右書一簡上奏言右書一簡上髙上虛皇玉晨太上大道君二十四玉皇三十九帝尊甲季世小臣忝染餘慶福祚所充得參上真謹依玄格正月一日上奏金簡記名東華乞賜編録降下真靈得乘飛霞上升帝晨身登金闕朝謁玉皇謹奏右三簡上令足某郡某縣鄉里某嶽道士王甲年如干歲字某甲右書一簡上某子生某月子命屬某嶽某帝某里右書一簡上太歲某子正月某子一日某子於某郡縣鄉中封某嶽奏右書一簡上合用金簡八枚紫繩編之北向讀簡一過畢起執簡再拜奏三元君玉札上篇某甲先生王甲字某甲本命某子某月生某年正月朔一日某子奏金簡玉札仙簿録籍符上詣白素元君黃素元君紫素元君三元紫蓋金輝洞房宫右書一尺白文上連玉簡頭係三元君玉清始學真人王甲稽首再拜右書一札上奏上右書一札上太素三元君甲昔有因緣福慶所種得受神經未敢披看謹依東華玄格奉奏玉札記名青宫上言三元乞賜編録降下真靈得升帝晨上朝玉真謹奏右書三札上某郡某縣鄉里某嶽始學真人王甲年如干字某甲右書一札上某子生某月子命屬某嶽某帝某甲右書一札上太歲某子正月某朔一日某子於某郡縣里中封某嶽奏右書一札上合用玉札八枚以紫繩編之西向讀玉札一過畢口祝上答太素元君黃素元君紫素元君甲昔蒙真師盟授真經今奏玉札記名三清乞賜給玉女真靈降身得乘紫霞上登帝宫畢起再拜奏東華青宫上相金簡一篇某嶽先生王甲字某甲本命某子某月生某年正月某朔一日某子奏金簡青録仙籍文上詣玉寶玉金闕上相髙晨師東海青童君東華方諸青宫右書青文一尺上連簡頭係髙上玉清青童上相始學真人王甲稽首再拜右書一簡上奏言右書一簡上太清玉寶金闕上相髙晨師東海青童君甲沉染下俗慶運所充福祚下流得生人道參真係氣志在絶跡栖身長阜託廕靈嶽謹案玄科奉奏金簡記名上宫乞賜上編玉清降下神真得離下世上升金闕進朝玉皇謹奏右書三簡上封金簡玉札五嶽上法某郡縣鄉里某嶽始學真人王甲年如干字某甲右書一簡上某子生某月子命屬某嶽某帝某星右書一簡上太歲某子正月某朔一日某子於某郡縣鄉里中封付某嶽奏右書一簡上合用金簡八枚以紫繩結之東向讀簡一過畢口祝上啓太清玉寶金闕上相高晨師東海青童君甲宿緣福慶充流後代蒙真師成就得受上經謹奏金簡記名青宫乞賜編録掌付玉郎普告諸天諸地洞清洞淵洞源五嶽衆仙咸見右别降以真靈得乘飛霞上升三清畢起再拜三面奏簡都畢還東向叩齒九通呪曰元綱玄邈天真幽冥蒙受先慶福加來生昔緣真師誡授寶經敢告三元上奏玉清金書東華録籍記名長為帝臣希降真靈賜給玉童玉女衛形得乘飛霄上升金闕拜謁玉庭畢仰咽液九過止都記以簡札埋於所屬嶽令玉皇篇在北三元篇在西青宫篇在東入土三尺堅築其上埋畢北向伏地叩齒九通又呪曰名奏玉格録字上清金簡玉札結篇皇庭髙上玄遐三元幽冥真官來降謹關有靈封簡神嶽録奏三清列上東華著我玉名得乘玄輿飛霞緑軿上造三元騰身帝晨訖起再拜元始天王所受太上投簡求仙上法三奏簡札九年之內玉皇尅降丹精玉芝龍璽鳳章太極真人來降子房三元剋遣玉童玉女三十六人上相青童剋告五嶽給以仙官飛霞玄蓋迎子之身上升金闕之宫太上寶祕此文不傳於世故付上相青童掌録以校真仙簿籍傳付應為真人者若有骨氣相冝或精求苦念感徹上清得見上文其名便以逆注青宫依科奏簡便成真人太上以西華玉女三十六人侍衛靈篇記功明善子有此文常當燒香禮念如奉君父神明自當降見於寢房也違科泄慢則身沒鬼官長閉地嶽萬不得仙明慎之焉諸學仙之家無有此文不得妄動三十九章玉清寶經凡詠玉經皆駭動九天諸天王悉禮伏聽音所徹髙遠所制不小詠誦之日東華領仙玉晨即校玉名有奏金簡者即普告諸天諸地三界悉使詣界稽首無有金名玉札而詠三十九章則遙動髙上即下執司右别妄叩神經之者皆忘神失精意性錯異怒喜無常也學者億萬至於合真無一勤苦求尋而鮮不中敗或自頽懈或興憤忿作性罵詈誅擊神鬼或毀謗神文疑惑不真或泄漏寶訣形露世間此皆由東華無有金名不為三界稱善而為衆魔所乘萬試所敗死之徴也故三十九章木可得而妄動有得此經冝加禮拜清齊修奉不妄詠諷久久自然當得金簡玉篇也謁青宫投金簡上格凡學道道成應真人皆先詣東華方諸青宫投簡謁青童君也東華有六門門內周回三千里東門名青華門門郎姓丘名伯淵主學仙簿録所經南門名神華玉門門郎姓玉名祖思主真人神仙出入所經西門名玉洞門門郎姓𢈔名尚節主髙上衆真玉皇三十九章二十四玉真西龜王母所出入北門名玉隂門門郎姓史名少華主真仙及始學者犯糾退降所經東南門名天關門郎姓名名五車主人宿命因緣簿録得仙所由東北門名寒水門門郎姓童名林都主鬼爽轉叙所經右六門治天束𡾩山門有師子巨狩各三百頭衛門侍門各三千守士學道之人冝先知門名次第有知者則為不死名便得奏青宫然當入室燒香常存念門名及門郎姓字九年剋得乘雲升門也此道祕在玉寶宫內有得知者白日升天輕泄傳付非真長閉夜獄終不得輕於東華青宫也門內有三宫第一宫名方諸青宫第二宫名玉寶青宫第三宫名玉華青宫宫內有玉𣗳數百株上有鵾鷂鳳皇九色之鳥下有芝草玉井自生之泉飲之夀同三光師子天獸附墻上相青童君治在方諸青宫之內金殿瓊房之裏衆真侍女三千人侍衛左右玄暉自映神燭自明青霞廕其上紫霄繞其房宫內北殿上有金格格上有玉格格上有學仙簿録及玄名年深深淺金簡玉札有十萬篇領仙玉郎典之有知者白日升天玉寶王上相大司馬髙晨師治王寶青紫宫雲繞其房虛煙生其堂自明神燭照其內衆仙玉女三千人侍衛左右宫內北殿上有金格格上有金章鳳璽玉札丹青羽蓋升仙法服以給成真之人又有學仙品目進叙及退降簿録侍仙玉晨典之有知者白日升天東海青華小童治在玉華青宫紫雲蓋其上日月夾其宇衆仙玉女三千人侍衛左右宫內東殿玉格上有寶經三百卷玉訣九千篇主學仙簿録應為真人者授之玉晨監仙侍郎典者白日升天東華青宫俯仰之格青童君曰凡學道求仙冝知俯仰之格有知者其名便以逆注青宫當勤心苦念入室燒香存想六門三室之內使分明羅列便叩齒三通仰呪曰上清玄晨三宫六門典我玉名降我神真龍裙羽章以給我身上升玉清東華投篇名刻金格長為帝賔畢咽氣九過止如此九年剋得真靈下降玉女見形玄雲緑軿來迎子身凡修此道不得履淹入穢常當清齊念真真無不降其法祕要不得妄傳傳非其人殃及七玄身被風刀之栲真人投簡正儀凡學道道成皆先詣東華青官投金簡更受仙號當至神華玉門未至門夾門有兩玉闕當伏闕左投簡須㬰當報便起進門下又伏門左須㬰當有四真人出引前便起直進方諸青宫伏於階下臨時自當有侍者唱讃聽唱便起再拜真人引上殿上當從南階左行上伏於殿前須㬰當有領仙玉郎齎金簡紫籍來校定玉名名參紫簿即授玉札更署真仙之號上升玉清羽童丹青飛桾金真玉光流金火鈴玉童玉女各三十六人仙官三十六人受署畢便起再拜退還階下又再拜至門止又再拜皆向宫也至時自當有所主統所治住止遊於五嶽之儀格也此青宫舊格不得妄傳未成真人者詣東華方諸青宫上相青童君几前某嶽先生王甲年如干歲一名某字甲某月生右金簡儀書一簡上此學道道成上詣青宫投金簡受署真仙上格上相藏於玉寶之宫不傳下世若有得者便是骨相合仙名應玉格自然亦得上升青宫也此法尤重不得妄宣有犯被拷三官深冝慎之上清金闕宫俯仰之格上清金闕宫在三元宫之北相去五萬里髙上所處之東去玄羽野西壟山九千里處玉清之西與天關連臺外有四門門有兩闕一闕金一闕玉皆夾門左右門有羽衣守士各三百人師子巨獸各三百首內有清精玉芝流霞之泉東門名玉景金融門門有二玉晨王執九節之麾各鎮一半髙上玉清虛皇太真之賔出入之所經南門名洞寶瓊雲門主真人飛仙遊宴八極周行五嶽出入之所經西門名玄京玉寶門主學仙受署真人進叙録簿所由經也北門名朔隂極雲門主真人犯非退降偏皇之任學素簡所經由也凡有四門門有兩闕金闕在左玉闕在右並髙九千丈金闕以金為柱紫雲為蓋刻金題闕衆真飛仙之號玉闕以青玉為柱緑雲為蓋刻玉題闕上皇太真之號八闕悉如是闕下則有青龍白虎處在左右天獸巨虬備衛玉闕玉童玉女各三百人散香其間闕上有九層金臺虛上玉晨領仙君所住門內周回七千里金闕宫處在中央中有金輝紫殿瓊房玉室後聖金闕帝君所住紫雲廕其上緑霞繞房日月夾照神燭自明金真玉女散香虛庭流光八玄風鼓玄旌回儛旄蓋玉樹激音琳枝自籟百響互生此金闕之上館衆真之所經其有四極真人主領學仙簿録進叙退降及始學儀則皆由四極真人也真人奉玉札儀格夫學道道成皆詣東華青宫校定金名退更清齊三月書玉札一枚詣金闕謁金闕帝君儀法當於洞寶瓊雲門外投玉札伏地須㬰待報便起再拜四極真人當引入進金闕下又在金闕左玉闕右伏地須㬰真人引進紫殿當從左行繞玉景金融門過東南行上登殿下伏階左領仙玉郎以紫鳳丹章飛行玉清飛青羽蓋丹錦飛裙十絶龍幡使登三元宫流金火鈴玉札金章令召千靈流雲玄霞九龍玉輿受號真仙飛行太空侍唱儀則事畢便起再拜揖謝三過此受號而巳未得便見帝君畢當直行詣朔隂極雲門金闕下東向伏地稱遊學先生王甲今受帝君真仙之號不勝喜慶謹詣闕謝聞乞丐虛上玉晨領仙君記名玉闕係在真仙之次起再拜次詣玄京玉寶門金闕下南向伏稱如上法次詣洞寶瓊雲門金闕下西向伏稱如上法次詣玉景金融門金闕下東向伏稱如上法詣四門八闕畢還從玉景金融門外更再拜伏地四極真人當齎金札玉章授其身時自當有五嶽仙官雲車來迎也其時自當有所之方面掌統靈嶽之任也詣玉清金闕宫後聖帝君几前某嶽先生臣王甲年如干嵗字某甲右金簡文書一簡上真人謁金闕投簡受號上法此學道道成上詣金闕謁金闕帝君更受真仙之號拜謝儀則帝君常所寶祕以授成真人之者不傳下世有得金闕宫名及金簡儀則此名逆注金格亦自然得登金闕也金闕宫門名此皆九天之𨼆名於地上之音異故髙上虛皇道君經易有九天之上西北門名易有去玄京寶門三千五百里然運明梁之氣二門相通也衆真之所遊叙次之所關既登易有之門便上升帝堂得謁玄景玉寶便得進朝三元學者未登此門冝知門名徒苦涉山林絶志人間而不知門户之所由天真之儀格何由得登金闕之宫夫存思之道不知神名所在神固不降欲登金闕上詣東華不知其名格宫因何登此乃出九天之上袐於金闕之裏知之者不死得者飛仙學者成真人世間不學之士有知金闕宫名天下三界稱善萬神禮形千妖喪目而况於積學之家耶其道寶貴不得輕傳非其人殃及七祖巳身受考無復仙冀矣真人披天關飛仙上法天關者是九天之生門也治在九天東南角一名天圖一名天關故為三關也衆真之所經神仙之所歷學者之由也其去金闕五千里玉清上宫七千里得披三關便得上登金闕逰宴玉清也第一天關上有九層玉臺去地一千二百丈下有長蛇數千飛龍毒獸備守玉關巨士三千人皆備交金之領奮牡門端太虛玉晨監字虛上明處在玉臺之上飛雲流霞夾映其房日月玄照光洞玉清侍者真仙三百人主上真出入開關所由第二天圖上有六層玉臺髙九百丈下有長蛇數千飛龍毒獸備守玉關巨士三千人皆備交金之領夾門兩端太上監真玉郎字玄上伯鎮在玉臺之上丹雲紫蓋鬱房玄光日月映其間侍者真仙三百人主監衆真遊宴之所經第三天關上有三層玉臺髙六百丈下有長蛇數千飛龍毒獸備守玉關巨士三千人皆備交金領夾衛兩端太帝監真玉司郎字無常生領生玉臺之上玄雲蓋其上虛煙馥其庭自明之光煥其形侍者真仙三百人主上天衆真地下衆真簿録簡籍所關由之凡受投金簡玉名之道當修披天關之法常當朝夕入室燒香叩齒十二通東向心拜四方存思見九天之端三關之下歷然分明都盡次存七星在天之上隨運而轉我身在天闕星上七星運我身至天關玉臺之下便投玉札一枚奏名太虛玉晨監自通見玉晨監以札記著玉格之上通我身至天圖之下次存我身還七星之上七星運我至天圖玉臺之下便投玉札一枚奏上上直真玉郎前自通見直真玉郎以札記著玉格之上通我身在天關之下次存我身還七星之上七星運我至天關玉臺之下便投玉札一枚奏太帝監真玉司郎前自通見監真玉司郎以札記著玉格之上通我身至金關之下玉清之宫次存失去七星身在空玄之上溟涬之中無所倚見須㬰覺在金闕玉景金融門之上投金札一枚見四極真人以玉案承札入奏金闕帝君前四極真人報與我俱登玉清之上次存玉清之上四極溟然無崖唯見青氣鬱鬱仰亦無天俯亦無地唯見中央有金門四達內有瓊宫玉玄金枝夾生兩邉巨龍走獸遊戲其巔存我周逰其間良久覺如睡眠巳逺寢床身中覺恍恍惚惚如體蹈空存遊洞都畢便叩齒三十六通仰天呪曰三華寶矅玉都開明玄暉敷陳映監無形金簡緑字剋奏玉名朗覩九天上戲三清天關三圖回登紫庭金闕受號東華記生得乘八景參御飛軿畢咽氣九過止凡學之人而不知披天之關奏簡記名之道萬亦旡成也三關總統諸天諸地上真飛仙及始學簿録莫不經於三關者也凡積學之徒能使九天三關有玉名三關玉晨奏於太上大帝之宫帝君自當遣玉童玉女各十二人營衛子身此太帝之上篇以傳天帝君天帝君以傳南極上元君南極上元君以傳太微天帝君太微天帝君以傳金闕帝君金闕帝君以傳上相青童君使教後學應為真人者依玄科七百年內聽得三出上元君以西華玉女九十人衛在南極紫房之內青童君曰有骨相應玄得見此道知有投簡之法便成真人但其科尢重不得輕泄夫學者積億遇真者幾人故中央黃老君云得見大洞真經三十九章便白日升天而有修之者積年無成便謂經之不真此皆坐由東華無有金簡之目金闕無有玉札之名真不為其降而為天魔所乘故有不感之效徒得神經萬亦不成矣向使先奏金簡於青宫奉玉札於帝皇得給金晨玉童西華玉女侍衛靈文普下諸天諸地三界稱善詠章萬遍豈不有致瓊輿紫軿之感耶披三關投玉札升仙上文詣天關玉臺太虛玉晨監几下某郡縣里鄉真人王甲年如干嵗字某甲詣天圖玉臺太上直真玉郎几下某郡縣鄉里真人王甲年如干歲字某甲詣天關玉臺太帝監真玉司几下某郡縣鄉里真人王甲年如干歲字某甲右書三玉札上令長一尺六寸披金闕投玉札升仙上文詣金闕宫玉闕帝君几前某郡縣鄉里真人王甲年如干歲字某甲某月生右書玉札上令長一尺六寸青童君云無有金簡者銀木亦可當無有玉札者桐木亦可當但令精好直理無關節耳青童君曰存披天關天圖天關上登青宫金闕玉清之道當書玉札先入室叩齒十二通東向讀札畢仍備修存念之道畢取札祕於雲錦之囊常燒香左右不得輕露此上真之至號玉郎之靈篇也若有金名玉字逆注青宫得見此道當依太真之科齎金簡玉札各一枚長一尺六寸廣二寸四分金龍玉魚各一枚紫繒百尺青紋四十尺以為太真之盟奉有經之師師東向受者北向告北帝為盟告七祖為誓約不宣泄之信當依玄科七百年內三傳傳非其人七玄之祖長充鬼役身沒九泉萬不得仙篤志之士希仙之夫當案科而奉真依文而修焉洞真上清青要紫書金根衆經卷下
